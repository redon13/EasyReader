# Builds the app and runs the tests on every push, to catch problems early.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build
        run: ./gradlew --no-daemon :calibre:test :app:testDebugUnitTest :app:assembleDebug

      # A test copy of the app. It installs as a separate "debug" app, so it
      # never clashes with the real one from Releases.
      - uses: actions/upload-artifact@v4
        with:
          name: EasyReader-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
